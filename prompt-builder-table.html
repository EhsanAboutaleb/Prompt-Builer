<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Builder (table)</title>
<style>
  :root, [data-theme="mint"] { color-scheme: light; --bg: #f3f5f2; --panel: #ffffff; --ink: #1d2623; --muted: #5c6a65; --line: #d5ddd8; --cell: #f6f9f7; --on: #1f6f5c; --on-ink: #ffffff; --head: #e3ebe6; --hit: #fff1b8; --hitline: #d9a400; --tint: #dcebe5; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme]) { color-scheme: dark; --bg: #151a18; --panel: #1e2623; --ink: #e6ede9; --muted: #93a39c; --line: #33403b; --cell: #232c29; --on: #3fae94; --on-ink: #0d1613; --head: #2c3733; --hit: #4a4012; --hitline: #d9b43a; --tint: #2a3d37; } }
  [data-theme="forest"] { color-scheme: dark; --bg: #151a18; --panel: #1e2623; --ink: #e6ede9; --muted: #93a39c; --line: #33403b; --cell: #232c29; --on: #3fae94; --on-ink: #0d1613; --head: #2c3733; --hit: #4a4012; --hitline: #d9b43a; --tint: #2a3d37; }
  [data-theme="ocean"] { color-scheme: light; --bg: #eef3f8; --panel: #ffffff; --ink: #1a2330; --muted: #586678; --line: #cfd9e4; --cell: #f5f8fb; --on: #1f5fa8; --on-ink: #ffffff; --head: #dde8f3; --hit: #fff1b8; --hitline: #d9a400; --tint: #d9e7f5; }
  [data-theme="navy"] { color-scheme: dark; --bg: #0f1722; --panel: #172131; --ink: #e4ecf6; --muted: #8fa1b8; --line: #2a3a50; --cell: #1c283a; --on: #5aa2f0; --on-ink: #08121f; --head: #243247; --hit: #4a4012; --hitline: #d9b43a; --tint: #213852; }
  [data-theme="sunset"] { color-scheme: light; --bg: #fbf3ec; --panel: #ffffff; --ink: #2b211b; --muted: #74645a; --line: #ead9c9; --cell: #fdf8f3; --on: #b5471c; --on-ink: #ffffff; --head: #f4e3d3; --hit: #fff1b8; --hitline: #d9a400; --tint: #f7e1cf; }
  [data-theme="rose"] { color-scheme: light; --bg: #fbf0f4; --panel: #ffffff; --ink: #2a1d23; --muted: #765f6a; --line: #ecd5de; --cell: #fdf6f9; --on: #a8266b; --on-ink: #ffffff; --head: #f5dfe8; --hit: #fff1b8; --hitline: #d9a400; --tint: #f6dbe7; }
  [data-theme="graphite"] { color-scheme: dark; --bg: #17181a; --panel: #202225; --ink: #e8e9eb; --muted: #9a9ea5; --line: #35383d; --cell: #26292d; --on: #e0a431; --on-ink: #1a1200; --head: #2e3136; --hit: #4a4012; --hitline: #d9b43a; --tint: #38352a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: .875rem/1.4 "Noto Sans", "Vazirmatn", system-ui, sans-serif; }
  main { max-width: none; padding: 10px 14px 20px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: 1.15rem; margin: 0; line-height: 1.2; }
  .hint { color: var(--muted); font-size: .85rem; }
  .credit { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: .88rem; }
  .logo { color: var(--on); font-size: 1.3rem; font-weight: 700; line-height: 1; }
  .hright { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .credit a { color: var(--on); text-decoration: none; font-weight: 600; padding: 1px 9px; border: 1px solid var(--line); border-radius: 999px; font-size: .82rem; }
  .credit a:hover { border-color: var(--on); }
  #fixText { flex: 1 1 340px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); min-width: 200px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, select, input { font: inherit; }
  .btn { padding: 5px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--head); color: var(--ink); cursor: pointer; }
  .btn:hover { border-color: var(--on); }
  .btn.primary { background: var(--on); border-color: var(--on); color: var(--on-ink); font-weight: 600; }
  .btn.sm { padding: 2px 9px; font-size: .82rem; }
  select { padding: 4px 7px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  label.opt { color: var(--muted); font-size: .86rem; display: inline-flex; gap: 6px; align-items: center; }
  #sheetWrap[hidden] { display: none; }
  #drop.over { outline: 2px dashed var(--on); outline-offset: 4px; }
  #q { padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); width: 15rem; }
  .push { margin-inline-start: auto; }
  #wrap { overflow: auto; max-height: max(240px, calc(100vh - 24rem)); border: 1px solid var(--line); border-radius: 8px; margin-top: 8px; }
  #wrap table { font-size: 1rem; }
  table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
  th, td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 8px; max-width: 16em; min-width: 6em; vertical-align: top; text-align: start; overflow-wrap: anywhere; }
  th { position: sticky; top: 0; background: var(--head); font-weight: 600; z-index: 1; }
  td { background: var(--cell); cursor: pointer; user-select: none; font-weight: 400; }
  td b { font-weight: 700; }
  td:hover { outline: 2px solid var(--on); outline-offset: -2px; }
  td.empty { background: var(--panel); }
  td.empty:not([data-e]) { cursor: default; }
  td.tg, th.hd.tg { background: var(--tint); }
  th.rn, th.ax, th.corner { font-weight: 500; font-size: .75rem; color: var(--muted); text-align: center; cursor: pointer; user-select: none; padding: 2px 6px; min-width: 0; }
  th.ax { z-index: 2; top: 0; }
  th.rn { top: auto; left: 0; z-index: 3; min-width: 2.7rem; max-width: 2.7rem; }
  th.rn.hdrn { top: var(--ah, 22px); z-index: 4; }
  th.corner { top: 0; left: 0; z-index: 5; min-width: 2.7rem; max-width: 2.7rem; cursor: default; }
  th.hd { top: var(--ah, 22px); }
  th.tsel { background: var(--on); color: var(--on-ink); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:disabled:hover { border-color: var(--line); }
  .vsep { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
  td.hit { background: var(--hit); box-shadow: inset 0 0 0 2px var(--hitline); }
  td.on { background: var(--on); color: var(--on-ink); }
  td input { width: 100%; font: inherit; padding: 2px 4px; }
  textarea { width: 100%; font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); resize: vertical; min-height: 64px; margin-top: 8px; }
  h2 { font-size: .95rem; margin: 0; }
  #status, #info, #found { color: var(--muted); font-size: .85rem; }
  .placeholder { padding: 24px; text-align: center; color: var(--muted); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
  .sub { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .list { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow: auto; }
  .item { border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; background: var(--cell); }
  .item .nm { font-weight: 600; overflow-wrap: anywhere; }
  .item .tx { overflow-wrap: anywhere; font-size: .9rem; max-height: 4.2em; overflow: hidden; }
  .item .acts { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
  button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--on); outline-offset: 2px; }
</style>
</head>
<body>
<main id="drop">
  <header>
    <div>
      <h1>Prompt builder</h1>
      <div class="hint">Open a file, click cells to build a prompt, double-click a cell to put it first. Tick Edit table to edit cells, rows and columns. You can also drag a file onto the page.</div>
    </div>
    <div class="hright">
      <div class="credit">
        <span class="logo" aria-hidden="true">&copy;</span><span>Developed by Ehsan Aboutaleb</span>
        <a href="https://ir.linkedin.com/in/eaboutaleb" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://github.com/EhsanAboutaleb" target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>
      <label class="opt">Theme
        <select id="theme">
          <option value="auto">Auto (follows system)</option>
          <option value="mint">Mint</option>
          <option value="forest">Forest (dark)</option>
          <option value="ocean">Ocean</option>
          <option value="navy">Navy (dark)</option>
          <option value="sunset">Sunset</option>
          <option value="rose">Rose</option>
          <option value="graphite">Graphite (dark)</option>
        </select>
      </label>
      <label class="opt">Font size
        <select id="fontSize">
          <option value="16">Compact</option>
          <option value="18">Small</option>
          <option value="20">Normal</option>
          <option value="22">Large</option>
          <option value="24">Extra large</option>
        </select>
      </label>
    </div>
  </header>

  <section>
    <div class="row">
      <button class="btn primary" id="pick">Open file (CSV, XLSX, ODS)</button>
      <input type="file" id="file" accept=".csv,.tsv,.txt,.xlsx,.xlsm,.ods,text/csv" hidden>
      <label class="opt" title="Only used for CSV files">Encoding
        <select id="enc">
          <option value="utf-8">UTF-8</option>
          <option value="windows-1256">Windows-1256</option>
        </select>
      </label>
      <label class="opt"><input type="checkbox" id="hdr" checked> First row is header</label>
      <label class="opt" id="sheetWrap" hidden>Sheet <select id="sheet"></select></label>
      <button class="btn sm" id="reload">Reload</button>
      <span id="info"></span>
      <span class="row push">
        <input type="search" id="q" dir="auto" placeholder="Search cells (Enter = first match)" aria-label="Search cells">
        <label class="opt"><input type="checkbox" id="only"> Only matching rows</label>
        <span id="found"></span>
      </span>
    </div>
    <div class="row" id="tools" style="margin-top:8px">
      <button class="btn sm" id="undo" title="Ctrl+Z">Undo</button>
      <button class="btn sm" id="redo" title="Ctrl+Y">Redo</button>
      <span class="vsep"></span>
      <button class="btn sm" id="addRow">+ Row</button>
      <button class="btn sm" id="addCol">+ Column</button>
      <label class="opt" title="Edit mode: double-click cells to edit them, and use row numbers and column letters to move, insert or delete rows and columns"><input type="checkbox" id="struct"> Edit table</label>
      <span class="row" id="ctx"></span>
      <span class="row push">
        <span class="hint">Export</span>
        <button class="btn sm" id="xXlsx">XLSX</button>
        <button class="btn sm" id="xOds">ODS</button>
        <button class="btn sm" id="xCsv">CSV</button>
      </span>
    </div>
    <div id="wrap"></div>
  </section>

  <section>
    <div class="row">
      <label class="opt">Join with
        <select id="sep">
          <option value=", ">comma</option>
          <option value=" ">space</option>
          <option value=". ">period</option>
          <option value="\n">new line</option>
        </select>
      </label>
      <label class="opt">Order
        <select id="ord">
          <option value="click">order I clicked</option>
          <option value="col">table order (columns)</option>
          <option value="row">table order (rows)</option>
        </select>
      </label>
      <button class="btn primary" id="copy">Copy prompt</button>
      <button class="btn" id="clearOut">Clear</button>
      <button class="btn" id="saveBtn">Save this combination</button>
      <span id="status" role="status"></span>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="opt"><input type="checkbox" id="fixOn"> Add fixed text</label>
      <select id="fixPos" aria-label="Position of the fixed text">
        <option value="end">at the end</option>
        <option value="start">at the start</option>
      </select>
      <input type="text" id="fixText" dir="auto" aria-label="Fixed text" placeholder="Text added to every prompt">
    </div>
    <textarea id="out" dir="auto" rows="3" placeholder="Click cells in the table to build your prompt"></textarea>
  </section>

  <section>
    <div class="cols">
      <div>
        <div class="sub"><h2>Saved combinations</h2>
          <span class="row">
            <button class="btn sm" id="import" title="Import prompts from a text file: an exported saved-prompts file or Selected-prompts.txt">Import</button>
            <button class="btn sm" id="export">Export as text</button>
            <input type="file" id="impFile" accept=".txt,text/plain" multiple hidden>
          </span>
        </div>
        <div class="list" id="saved"></div>
      </div>
      <div>
        <div class="sub"><h2>Recently copied</h2><button class="btn sm" id="clearHist">Clear history</button></div>
        <div class="list" id="hist"></div>
      </div>
    </div>
  </section>
</main>

<script>
(function () {
  var KEY = "promptBuilderTable.v1";
  var S = { data: [], header: true, sel: [], sep: ", ", ord: "click", name: "", enc: "utf-8" };
  var lastFile = null;
  var $ = function (i) { return document.getElementById(i); };

  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.data)) S = s; } catch (e) {}
  }

  // CSV parser with quotes; auto-detects , ; or tab
  function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    var first = text.split(/\r?\n/)[0] || "";
    var cands = [",", ";", "\t"], d = ",", best = -1;
    cands.forEach(function (c) { var n = first.split(c).length; if (n > best) { best = n; d = c; } });
    var rows = [], row = [], cur = "", q = false, i, ch;
    for (i = 0; i < text.length; i++) {
      ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === d) { row.push(cur); cur = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(cur); rows.push(row); row = []; cur = "";
      } else cur += ch;
    }
    if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
    while (rows.length && rows[rows.length - 1].every(function (c) { return c.trim() === ""; })) rows.pop();
    var w = rows.reduce(function (m, r) { return Math.max(m, r.length); }, 0);
    return rows.map(function (r) { var o = r.map(function (c) { return c.trim(); }); while (o.length < w) o.push(""); return o; });
  }

/*PARSERS_START*/
  var B0 = "\uE000", B1 = "\uE001";   // private markers that wrap bold text inside a cell
  function plain(s) { return String(s).replace(/[\uE000\uE001]/g, ""); }
  function mark(t) {
    var m = /^(\s*)([\s\S]*?)(\s*)$/.exec(t);
    return m[2] ? m[1] + B0 + m[2] + B1 + m[3] : t;
  }
  function joinBold(s) { return s.split(B1 + B0).join(""); }
  function toMd(s) { return String(s).replace(/[\uE000\uE001]/g, "**"); }
  function fromMd(s) {
    var parts = String(s).split("**"), out = "";
    parts.forEach(function (p, i) {
      if (i % 2 === 1) out += (i < parts.length - 1) ? mark(p) : "**" + p;
      else out += p;
    });
    return joinBold(out);
  }
  function rich(td, v) {
    td.textContent = "";
    String(v).split(/(\uE000[\s\S]*?\uE001)/).forEach(function (p) {
      if (!p) return;
      if (p.charAt(0) === B0) { var b = document.createElement("b"); b.textContent = plain(p); td.appendChild(b); }
      else td.appendChild(document.createTextNode(p));
    });
  }

  function tidy(rows) {
    var dense = [], i, j, w = 0;
    for (i = 0; i < rows.length; i++) {
      var src = rows[i] || [], r = [];
      for (j = 0; j < src.length; j++) r.push(src[j] == null ? "" : String(src[j]).trim());
      dense.push(r);
    }
    while (dense.length && dense[dense.length - 1].every(function (c) { return c === ""; })) dense.pop();
    dense.forEach(function (r) { for (var k = r.length; k > 0; k--) if (r[k - 1] !== "") { if (k > w) w = k; break; } });
    return dense.map(function (r) { r = r.slice(0, w); while (r.length < w) r.push(""); return r; });
  }
  function xml(t) {
    var d = new DOMParser().parseFromString(t, "application/xml");
    if (d.getElementsByTagName("parsererror").length) throw new Error("Could not read the file's XML");
    return d;
  }
  function each(list, fn) { Array.prototype.forEach.call(list, fn); }

  async function unzip(buf) {
    if (typeof DecompressionStream === "undefined") throw new Error("This browser cannot open xlsx/ods. Update Firefox or save as CSV.");
    var dv = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder(), files = {}, i;
    for (i = buf.byteLength - 22; i >= 0; i--) if (dv.getUint32(i, true) === 0x06054b50) break;
    if (i < 0) throw new Error("Not a valid zip-based file");
    var n = dv.getUint16(i + 10, true), p = dv.getUint32(i + 16, true);
    for (var e = 0; e < n; e++) {
      var nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
      files[dec.decode(u8.subarray(p + 46, p + 46 + nl))] = { m: dv.getUint16(p + 10, true), cs: dv.getUint32(p + 20, true), off: dv.getUint32(p + 42, true) };
      p += 46 + nl + xl + cl;
    }
    return {
      has: function (name) { return !!files[name]; },
      get: async function (name) {
        var f = files[name]; if (!f) return null;
        var start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
        var data = u8.subarray(start, start + f.cs);
        if (f.m === 0) return dec.decode(data);
        if (f.m !== 8) throw new Error("Unsupported zip compression");
        var ab = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
        return dec.decode(ab);
      }
    };
  }

  // ---- xlsx ----
  function isB(el) {
    var b = null;
    each(el.childNodes, function (c) { if (c.nodeType === 1 && c.localName === "b") b = c; });
    if (!b) return false;
    var v = b.getAttribute("val"); return v !== "0" && v !== "false";
  }
  // A shared/inline string item: text with bold markers, and whether it has formatted runs
  function richItem(si) {
    var out = "", isRich = false;
    each(si.childNodes, function (n) {
      if (n.nodeType !== 1) return;
      if (n.localName === "t") out += n.textContent;
      else if (n.localName === "r") {
        isRich = true;
        var t = "", bold = false;
        each(n.childNodes, function (c) {
          if (c.nodeType !== 1) return;
          if (c.localName === "t") t += c.textContent;
          else if (c.localName === "rPr") bold = isB(c);
        });
        out += bold ? mark(t) : t;
      }
    });
    return { s: joinBold(out), rich: isRich };
  }
  function colIdx(ref) {
    var m = /^([A-Za-z]+)/.exec(ref), n = 0;
    for (var i = 0; i < m[1].length; i++) n = n * 26 + (m[1].toUpperCase().charCodeAt(i) - 64);
    return n - 1;
  }
  function xlsxRows(doc, shared, bx) {
    var rows = [], seq = 0;
    each(doc.getElementsByTagNameNS("*", "row"), function (row) {
      var ri = row.getAttribute("r") ? +row.getAttribute("r") - 1 : seq; seq = ri + 1;
      var arr = rows[ri] = rows[ri] || [], cseq = 0;
      each(row.getElementsByTagNameNS("*", "c"), function (c) {
        var ref = c.getAttribute("r"), ci = ref ? colIdx(ref) : cseq; cseq = ci + 1;
        var t = c.getAttribute("t"), ve = c.getElementsByTagNameNS("*", "v")[0], v = ve ? ve.textContent : "", isRich = false;
        if (t === "s") { var it = shared[+v]; v = it ? it.s : ""; isRich = !!(it && it.rich); }
        else if (t === "inlineStr") {
          var is = c.getElementsByTagNameNS("*", "is")[0], ii = is ? richItem(is) : { s: "", rich: false };
          v = ii.s; isRich = ii.rich;
        }
        else if (t === "b") v = v === "1" ? "TRUE" : "FALSE";
        if (!isRich && v.trim() && bx[+c.getAttribute("s") || 0]) v = mark(v);   // whole-cell bold
        arr[ci] = v;
      });
    });
    return rows;
  }
  async function readXlsx(z) {
    var wb = xml(await z.get("xl/workbook.xml")), rels = {}, shared = [], bx = [], out = [];
    var rt = await z.get("xl/_rels/workbook.xml.rels");
    if (rt) each(xml(rt).getElementsByTagNameNS("*", "Relationship"), function (r) { rels[r.getAttribute("Id")] = r.getAttribute("Target"); });
    var st = await z.get("xl/sharedStrings.xml");
    if (st) each(xml(st).getElementsByTagNameNS("*", "si"), function (si) { shared.push(richItem(si)); });
    var sty = await z.get("xl/styles.xml");
    if (sty) {
      var sd = xml(sty), fonts = [], fe = sd.getElementsByTagNameNS("*", "fonts")[0], cx = sd.getElementsByTagNameNS("*", "cellXfs")[0];
      if (fe) each(fe.childNodes, function (f) { if (f.nodeType === 1 && f.localName === "font") fonts.push(isB(f)); });
      if (cx) each(cx.childNodes, function (x) { if (x.nodeType === 1 && x.localName === "xf") bx.push(!!fonts[+x.getAttribute("fontId") || 0]); });
    }

  function moveCol(i, j) { pushUndo(); S.data.forEach(function (r) { r.splice(j, 0, r.splice(i, 1)[0]); }); remapSel(null, moveMap(i, j)); }
  function done() { if (!S.data.length) S.sel = []; save(); render(); }

  function renderTools() {
    var c = $("ctx"); c.innerHTML = "";
    $("undo").disabled = !undoSt.length; $("redo").disabled = !redoSt.length;
    if (!S.struct) T = null;
    if (!T) return;
    var isR = T.type === "row", n = isR ? S.data.length : nCols();
    if (T.i >= n) { T = null; return; }
    var lab = document.createElement("span"); lab.className = "hint";
    lab.textContent = isR ? "Row " + (T.i + 1) + ":" : "Column " + colName(T.i) + ":";
    c.appendChild(lab);
    function add(label, fn, off) {
      var b = document.createElement("button"); b.className = "btn sm"; b.textContent = label; b.disabled = !!off; b.onclick = fn; c.appendChild(b);
    }
    add(isR ? "\u2191 Up" : "\u2190 Left", function () { (isR ? moveRow : moveCol)(T.i, T.i - 1); T.i--; done(); }, T.i === 0);
    add(isR ? "\u2193 Down" : "\u2192 Right", function () { (isR ? moveRow : moveCol)(T.i, T.i + 1); T.i++; done(); }, T.i === n - 1);
    add(isR ? "Insert above" : "Insert left", function () { (isR ? insertRow : insertCol)(T.i); done(); });
    add(isR ? "Insert below" : "Insert right", function () { var at = T.i + 1; (isR ? insertRow : insertCol)(at); T.i = at; done(); });
    add(isR ? "Delete row" : "Delete column", function () { (isR ? delRow : delCol)(T.i); T = null; done(); });
  }
  $("struct").onchange = function () { S.struct = this.checked; T = null; save(); render(); };
  function applyTheme() {
    if (S.theme && S.theme !== "auto") document.documentElement.setAttribute("data-theme", S.theme);
    else document.documentElement.removeAttribute("data-theme");
  }
  $("theme").onchange = function () { S.theme = this.value; save(); applyTheme(); };
  function applyFont() { document.documentElement.style.fontSize = (S.font || 20) + "px"; }
  $("fontSize").onchange = function () { S.font = +this.value; save(); applyFont(); render(); };
  var FIXED_DEFAULT = "Strong eye contact with the viewer, high contrast, 8k detail, sharp focus, magazine cover quality, keep face details";
  $("fixOn").onchange = function () { S.fixOn = this.checked; save(); build(); };
  $("fixPos").onchange = function () { S.fixPos = this.value; save(); build(); };
  $("fixText").oninput = function () { S.fixText = this.value; save(); build(); };

  // Prompts in a text file are separated by empty lines (the format of the export and of Selected-prompts.txt)
  function importPrompts(text) {
    var items = String(text).replace(/\r\n?/g, "\n").replace(/^\uFEFF/, "").split(/\n[ \t]*\n+/)
      .map(function (x) { return x.trim(); }).filter(Boolean);
    var have = {}, added = 0;
    S.saved.forEach(function (e) { have[e.t] = 1; });
    items.forEach(function (t) {
      if (have[t]) return;
      have[t] = 1; S.saved.unshift({ n: t.slice(0, 40), t: t, sel: [] }); added++;
    });
    save(); renderLists();
    return { added: added, total: items.length };
  }
  function reportImport(a, t) {
    flash(t ? a + " imported" + (t > a ? ", " + (t - a) + " already saved" : "") : "No prompts found in that file");
  }
  $("import").onclick = function () { $("impFile").click(); };
  $("impFile").onchange = async function () {
    var list = Array.prototype.slice.call(this.files).sort(function (a, b) { return a.name < b.name ? -1 : 1; }), a = 0, t = 0;
    for (var i = 0; i < list.length; i++) { var r = importPrompts(await list[i].text()); a += r.added; t += r.total; }
    this.value = ""; reportImport(a, t);
  };
  $("undo").onclick = undo;
  $("redo").onclick = redo;
  $("addRow").onclick = function () { insertRow(S.data.length); T = null; done(); };
  $("addCol").onclick = function () { insertCol(nCols()); T = null; done(); };
  document.addEventListener("keydown", function (e) {
    if (!(e.ctrlKey || e.metaKey) || /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ""))) return;
    var k = e.key.toLowerCase();
    if (k === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (k === "y" || (k === "z" && e.shiftKey)) { e.preventDefault(); redo(); }
  });

  // ---- export (the current table, including edits) ----
  function fileBase() { return (S.name || "table").replace(/ \u2013 .*$/, "").replace(/\.[^.]+$/, "") + "-edited"; }
  function download(blob, name) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
    flash("Exported " + name);
  }
  function sheetLabel() { return (S.name || "").indexOf(" \u2013 ") > -1 ? S.name.split(" \u2013 ").pop() : "Prompts"; }
  $("xXlsx").onclick = function () { if (!S.data.length) return flash("Nothing to export"); download(new Blob([xlsxBlob(S.data, sheetLabel())], { type: XLSX_MIME }), fileBase() + ".xlsx"); };
  $("xOds").onclick = function () { if (!S.data.length) return flash("Nothing to export"); download(new Blob([odsBlob(S.data, sheetLabel())], { type: ODS_MIME }), fileBase() + ".ods"); };
  $("xCsv").onclick = function () { if (!S.data.length) return flash("Nothing to export"); download(new Blob([csvText(S.data)], { type: "text/csv;charset=utf-8" }), fileBase() + ".csv"); };

  $("wrap").addEventListener("click", function (e) {
    var ah = e.target.closest("th");
    if (ah && (ah.dataset.col !== undefined || ah.dataset.row !== undefined)) {
      var tt = ah.dataset.col !== undefined ? "col" : "row", ti = +(ah.dataset.col !== undefined ? ah.dataset.col : ah.dataset.row);
      T = (T && T.type === tt && T.i === ti) ? null : { type: tt, i: ti };
      render(); return;
    }
    var td = e.target.closest("td"); if (!td || !td.dataset.k || e.target.tagName === "INPUT") return;
    var k = td.dataset.k, p = S.sel.indexOf(k);
    if (p > -1) { S.sel.splice(p, 1); td.classList.remove("on"); } else { S.sel.push(k); td.classList.add("on"); }
    save(); build();
  });

  $("wrap").addEventListener("dblclick", function (e) {
    if (!S.struct) {   // normal mode: double-click moves the cell to the first place in the prompt
      var tf = e.target.closest("td");
      if (tf && tf.dataset.k) {
        var kf = tf.dataset.k;
        S.sel = S.sel.filter(function (x) { return x !== kf; }); S.sel.unshift(kf);
        tf.classList.add("on"); save(); build();
        if (S.ord !== "click") flash("Set Order to \u201corder I clicked\u201d to control the position");
      }
      return;
    }
    var td = e.target.closest("td,th"); if (!td || !td.dataset.e) return;
    var k = td.dataset.e, p = k.split(",").map(Number), inp = document.createElement("input"), done = false;
    inp.value = toMd(S.data[p[0]][p[1]]); inp.setAttribute("dir", "auto");
    td.textContent = ""; td.appendChild(inp); inp.focus(); inp.select();
    function fin(ok) {
      if (done) return; done = true;
      var v = inp.value.trim();
      if (ok) {
        var nv = fromMd(v);
        if (nv !== S.data[p[0]][p[1]]) {
          pushUndo(); S.data[p[0]][p[1]] = nv;
          if (!nv) S.sel = S.sel.filter(function (x) { return x !== k; });
        }
      }
      save(); render();
    }
    inp.onkeydown = function (ev) { if (ev.key === "Enter") fin(true); if (ev.key === "Escape") fin(false); };
    inp.onblur = function () { fin(true); };
  });

  // Case-insensitive; treats Arabic and Persian yeh/kaf the same and ignores diacritics
  function norm(s) {
    return plain(s).toLowerCase().replace(/\u064a/g, "\u06cc").replace(/\u0643/g, "\u06a9").replace(/[\u064B-\u065F\u0640]/g, "");
  }
  $("q").oninput = render;
  $("only").onchange = render;
  $("q").onkeydown = function (e) {
    if (e.key === "Escape") { this.value = ""; render(); }
    if (e.key === "Enter") { var h = document.querySelector("td.hit"); if (h) h.scrollIntoView({ block: "center", inline: "center" }); }
  };

  $("sheet").onchange = function () { useSheet(+this.value); };
  $("pick").onclick = function () { $("file").click(); };
  $("file").onchange = function () { if (this.files[0]) readFile(this.files[0]); this.value = ""; };
  $("reload").onclick = function () { if (lastFile) readFile(lastFile); else $("file").click(); };
  $("clearOut").onclick = function () { S.sel = []; save(); render(); };
  $("hdr").onchange = function () { S.header = this.checked; S.sel = []; save(); render(); };
  $("sep").onchange = function () { S.sep = this.value; save(); build(); };
  $("ord").onchange = function () { S.ord = this.value; save(); build(); };
  $("enc").onchange = function () { S.enc = this.value; if (lastFile) readFile(lastFile); };

  var drop = $("drop");
  ["dragenter", "dragover"].forEach(function (n) { drop.addEventListener(n, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
  ["dragleave", "drop"].forEach(function (n) { drop.addEventListener(n, function (e) { e.preventDefault(); drop.classList.remove("over"); }); });
  drop.addEventListener("drop", function (e) { var f = e.dataTransfer.files[0]; if (f) readFile(f); });

  function flash(m) { $("status").textContent = m; setTimeout(function () { $("status").textContent = ""; }, 2200); }

  function copyText(txt, ok) {
    var fb = function () {
      var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta); ok();
    };
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, fb); else fb();
  }

  function selSnap() { return S.sel.map(function (k) { return { k: k, t: text(k) }; }); }

  function addHist(t) {
    t = t.trim(); if (!t) return;
    if (S.hist[0] && S.hist[0].t === t) return;
    S.hist.unshift({ t: t, sel: selSnap() });
    S.hist = S.hist.slice(0, 20);
    save(); renderLists();
  }

  // Re-select the cells of a saved/history entry, matching by cell text if the table changed
  function restore(e) {
    var sel = [], used = {}, want = e.sel || [];
    want.forEach(function (x) {
      var k = null, r, c;
      if (x.t && text(x.k) === x.t) k = x.k;
      else {
        for (r = startRow(); r < S.data.length && !k; r++)
          for (c = 0; c < S.data[r].length; c++)
            if (x.t && plain(S.data[r][c]) === x.t && !used[key(r, c)]) { k = key(r, c); break; }
      }
      if (k && !used[k]) { used[k] = 1; sel.push(k); }
    });
    S.sel = sel; save(); render();
    $("out").value = e.t;
    flash(sel.length < want.length ? "Loaded (some cells were not found in this table)" : "Loaded");
  }

  function item(name, txt, btns) {
    var d = document.createElement("div"); d.className = "item";
    if (name) { var n = document.createElement("div"); n.className = "nm"; n.textContent = name; n.setAttribute("dir", "auto"); d.appendChild(n); }
    var x = document.createElement("div"); x.className = "tx"; x.textContent = txt; x.title = txt; x.setAttribute("dir", "auto"); d.appendChild(x);
    var a = document.createElement("div"); a.className = "acts";
    btns.forEach(function (b) {
      var e = document.createElement("button"); e.className = "btn sm"; e.textContent = b[0]; e.onclick = b[1]; a.appendChild(e);
    });
    d.appendChild(a); return d;
  }
  function note(m) { var e = document.createElement("div"); e.style.color = "var(--muted)"; e.textContent = m; return e; }

  function renderLists() {
    var h = $("hist"), s = $("saved"); if (!h || !s) return;
    h.innerHTML = ""; s.innerHTML = "";
    if (!S.hist.length) h.appendChild(note("Prompts you copy will appear here."));
    S.hist.forEach(function (e, i) {
      h.appendChild(item(null, e.t, [
        ["Copy", function () { copyText(e.t, function () { flash("Copied"); }); }],
        ["Save", function () { S.saved.unshift({ n: e.t.slice(0, 40), t: e.t, sel: e.sel || [] }); save(); renderLists(); flash("Saved"); }],
        ["\u00d7", function () { S.hist.splice(i, 1); save(); renderLists(); }]
      ]));
    });
    if (!S.saved.length) s.appendChild(note("Build a prompt you like and click \u201cSave this combination\u201d."));
    S.saved.forEach(function (e, i) {
      s.appendChild(item(e.n, e.t, [
        ["Load", function () { restore(e); }],
        ["Copy", function () { copyText(e.t, function () { flash("Copied"); }); }],
        ["Rename", function () { var n = prompt("Name", e.n); if (n && n.trim()) { e.n = n.trim(); save(); renderLists(); } }],
        ["\u00d7", function () { if (confirm("Delete \u201c" + e.n + "\u201d?")) { S.saved.splice(i, 1); save(); renderLists(); } }]
      ]));
    });
  }

  $("copy").onclick = function () {
    var t = $("out").value;
    copyText(t, function () { flash("Copied"); addHist(t); });
  };
  $("saveBtn").onclick = function () {
    var t = $("out").value.trim(); if (!t) { flash("Select some cells first"); return; }
    var n = t.slice(0, 40);
    S.saved.unshift({ n: n, t: t, sel: selSnap() });
    save(); renderLists(); flash("Saved");
  };
  $("clearHist").onclick = function () { S.hist = []; save(); renderLists(); };
  $("export").onclick = function () {
    if (!S.saved.length) { flash("Nothing to export yet"); return; }
    var txt = S.saved.slice().reverse().map(function (e) { return e.t; }).join("\n\n") + "\n";
    var d = new Date(), z = function (n, l) { return String(n).padStart(l || 2, "0"); };
    var fname = "saved-prompts-" + d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + "-" + z(d.getHours()) + z(d.getMinutes()) + z(d.getSeconds()) + z(d.getMilliseconds(), 3) + ".txt";
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([txt], { type: "text/plain;charset=utf-8" }));
    a.download = fname; flash("Exported " + fname);
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  };

  load(); S.hist = S.hist || []; S.saved = S.saved || [];
  if (S.fontV !== 2) { S.font = (S.font >= 18) ? S.font : 20; S.fontV = 2; }
  if (S.fixText === undefined) { S.fixText = FIXED_DEFAULT; S.fixOn = true; S.fixPos = "end"; }
  render();
})();
</script>
</body>
</html>
